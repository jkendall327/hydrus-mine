step = 10
request = "file_sort_type=9&file_sort_asc=true"
skip = true
reason = "the reference ignores sorting by number of tags in the Client API; we sort"

[[difference]]
scenario = "search"
step = 11
request = "file_sort_type=9&file_sort_asc=false"
skip = true
reason = "the reference ignores sorting by number of tags in the Client API; we sort"

[[difference]]
