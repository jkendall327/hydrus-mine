[package]
name = "hydrus-api"
description = "The hydrus Client API, compatible with the reference implementation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hydrus-core.workspace = true
hydrus-store.workspace = true
hydrus-import.workspace = true
hydrus-download.workspace = true
hydrus-net.workspace = true
hydrus-media.workspace = true
hydrus-search.workspace = true
hydrus-duplicates.workspace = true
hydrus-legacy.workspace = true
axum.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
# HTTPS (the reference's `use_https`): a self-signed pair as the reference
# makes one, served over rustls (already in the tree through reqwest)
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "logging", "tls12"] }
time = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
ciborium.workspace = true
base64.workspace = true
bytes.workspace = true
form_urlencoded.workspace = true
percent-encoding.workspace = true
parking_lot.workspace = true
rand.workspace = true
rusqlite.workspace = true

tempfile.workspace = true
hydrus-workspace-hack = { version = "0.1", path = "../hydrus-workspace-hack" }

[dev-dependencies]
x509-parser = "0.18"
png.workspace = true
turbojpeg.workspace = true
image-webp.workspace = true
base64.workspace = true
regex.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
hydrus-testkit.workspace = true
sha2.workspace = true
toml.workspace = true

[lints]
workspace = true
