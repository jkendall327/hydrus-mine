[package]
name = "hydrus-gui"
description = "The hydrus-rs desktop client (Slint)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hydrus-gui"
path = "src/main.rs"

[features]
default = ["compiled-ui"]
# the UI as compiled Rust (generated/hydrus-gui-ui-*)
compiled-ui = ["hydrus-gui-ui/compiled"]
# (spike) the same UI API run by Slint's interpreter
interpreter-ui = ["hydrus-gui-ui/interpreter"]
interpreter-cached-ui = ["hydrus-gui-ui/interpreter-cached"]

[dependencies]
jiff.workspace = true
hydrus-core.workspace = true
hydrus-gui-model.workspace = true
hydrus-gui-ui = { workspace = true, default-features = false }
hydrus-store.workspace = true
hydrus-parse.workspace = true
hydrus-net.workspace = true
hydrus-download.workspace = true
tokio.workspace = true
tracing.workspace = true
hydrus-downloader-exchange = { path = "../hydrus-downloader-exchange" }
hydrus-legacy.workspace = true
rusqlite.workspace = true
hydrus-search.workspace = true
hydrus-duplicates.workspace = true
hydrus-media.workspace = true
hydrus-import.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
serde_json.workspace = true
png.workspace = true
hex.workspace = true
rand.workspace = true
arboard = { version = "3", default-features = false, features = ["image-data"] }
# the system's file and folder pickers (on Linux, the desktop portal)
fs4.workspace = true
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tempfile.workspace = true
slint.workspace = true
i-slint-core.workspace = true
hydrus-workspace-hack = { version = "0.1", path = "../hydrus-workspace-hack" }

# whether a StatusNotifierWatcher is on the session bus, that is a tray to
# show an icon in (Slint's tray, through ksni, already brings zbus)
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# the X server's idle time, for the session autosave's idle gate
x11rb = { version = "0.13", default-features = false, features = ["screensaver"] }

[dev-dependencies]
# fake input for the X server the idle time is read from
x11rb = { version = "0.13", default-features = false, features = ["xtest", "screensaver"] }
hydrus-api.workspace = true
axum.workspace = true
tower.workspace = true
hydrus-testkit.workspace = true
regex.workspace = true

[lints]
workspace = true
