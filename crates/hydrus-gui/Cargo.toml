[package]
name = "hydrus-gui"
description = "The hydrus-rs desktop client (Slint)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "hydrus-gui"
path = "src/main.rs"

[dependencies]
jiff.workspace = true
hydrus-core.workspace = true
hydrus-gui-model.workspace = true
hydrus-store.workspace = true
hydrus-parse.workspace = true
hydrus-net.workspace = true
tokio.workspace = true
hydrus-downloader-exchange = { path = "../hydrus-downloader-exchange" }
rusqlite.workspace = true
hydrus-search.workspace = true
hydrus-duplicates.workspace = true
hydrus-media.workspace = true
hydrus-import.workspace = true
anyhow.workspace = true
crossbeam-channel.workspace = true
libloading.workspace = true
serde_json.workspace = true
png.workspace = true
hex.workspace = true
rand.workspace = true
arboard = { version = "3", default-features = false }
# the system's file and folder pickers (on Linux, the desktop portal)
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tempfile.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
hydrus-api.workspace = true
axum.workspace = true
tower.workspace = true
hydrus-download.workspace = true
hydrus-legacy.workspace = true
hydrus-testkit.workspace = true

[lints]
workspace = true
