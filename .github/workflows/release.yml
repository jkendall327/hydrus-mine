name: release

# Builds release binaries of hydrus-rs for the owner's own use and attaches
# them to a GitHub release. Runs when a version tag (v1.2.3, v0.1.0-pre, ...)
# is pushed, or by hand from the Actions tab (that run only uploads the
# archives as workflow artifacts, without making a release).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The archives hold `hydrus` (the command line and server) and `hydrus-gui`
# (the desktop client). ffmpeg and libmpv are not bundled; see
# docs/rust/MIGRATING.md for what each platform needs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            exe: ''
          - os: windows-latest
            name: windows-x86_64
            exe: .exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Linux keeps line tables through the build so the step "split debug info"
      # can move them into a separate .debug file; the shipped binaries are
      # stripped (hydrus-gui is ~210 MB instead of ~900 MB). Windows ships the
      # profile's own settings (no debug info). (The `runner` context is not
      # available in a job's env, so this tests matrix.os.)
      CARGO_PROFILE_RELEASE_DEBUG: ${{ startsWith(matrix.os, 'ubuntu') && 'line-tables-only' || 'false' }}
      CARGO_PROFILE_RELEASE_STRIP: ${{ startsWith(matrix.os, 'ubuntu') && 'none' || 'debuginfo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      # (no rust-cache: a tag's run can't restore caches saved on branches, and
      # saving a release target/ would evict rust.yml's caches from the quota)
      - name: install fontconfig (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libfontconfig1-dev
      - name: build the generated UI on its own
        # Its crates one after another, each alone, so none overlaps the GUI crate
        # or another (see scripts/dev.sh).
        shell: bash
        run: |
          cargo build --release -p hydrus-gui-ui-core --locked
          for dir in generated/hydrus-gui-ui-*; do
            [ "$dir" = generated/hydrus-gui-ui-core ] || cargo build --release -p "${dir#generated/}" --locked
          done
          cargo build --release -p hydrus-gui-ui --locked
      - name: build
        run: cargo build --release --locked -p hydrus-cli -p hydrus-gui
      - name: split debug info (Linux)
        if: runner.os == 'Linux'
        # A panic backtrace needs file:line; std finds the .debug file through
        # the .gnu_debuglink next to the binary. Ship both in the debug archive.
        run: |
          mkdir debug
          for exe in hydrus hydrus-gui; do
            objcopy --only-keep-debug "target/release/$exe" "debug/$exe.debug"
            strip --strip-debug "target/release/$exe"
            (cd target/release && objcopy --add-gnu-debuglink="../../debug/$exe.debug" "$exe")
          done
          ls -l target/release/hydrus target/release/hydrus-gui debug
      - name: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version="dev-${GITHUB_SHA::8}"
          dir="hydrus-rs-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/hydrus${{ matrix.exe }}" "target/release/hydrus-gui${{ matrix.exe }}" "$dir/"
          cp docs/rust/MIGRATING.md "$dir/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            7z a "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
            # Line tables for backtraces: unpack next to the binaries.
            mkdir "$dir-debug"
            cp debug/*.debug "$dir-debug/"
            tar czf "$dir-debug.tar.gz" "$dir-debug"
            echo "DEBUG_ARCHIVE=$dir-debug.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30
      - name: upload the debug archive (Linux)
        # Its own artifact, so the normal download is just the program.
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-debug
          path: ${{ env.DEBUG_ARCHIVE }}
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
