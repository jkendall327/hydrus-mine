name: rust

on:
  push:
    branches: [master, 'claude/**', 'codex/**']
    paths: ['crates/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  # (from the Actions tab)
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}-${{ (github.head_ref == 'codex/overnight-gui-burndown' || startsWith(github.head_ref, 'codex/parity-')) && github.event.pull_request.head.sha || 'latest' }}
  # Overnight implementation continues while earlier checkpoints validate.
  cancel-in-progress: ${{ github.head_ref != 'codex/overnight-gui-burndown' && github.ref != 'refs/heads/codex/overnight-gui-burndown' && !startsWith(github.head_ref, 'codex/parity-') && !startsWith(github.ref, 'refs/heads/codex/parity-') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # This branch has an open PR: run once per checkpoint, rather than both
    # its push and pull_request events. Other branch pushes still validate.
    if: github.event_name != 'push' || (github.ref != 'refs/heads/codex/overnight-gui-burndown' && !startsWith(github.ref, 'refs/heads/codex/parity-'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse compilation completed before a later diagnostic fails.
          cache-on-failure: true
          # GUI fixture-only repairs can reuse the unchanged workspace libraries.
          # Keep this experiment on Linux while measuring cache/storage cost.
          cache-workspace-crates: true
      - name: install media tools, and fontconfig for the GUI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --keep-going 2>&1 | tee /tmp/hydrus-clippy.log
      - name: save immediate Clippy diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hydrus-clippy.log
          if-no-files-found: ignore
          retention-days: 3
      - name: test
        # Keep behavioral feedback flowing even when a lint needs repair.
        # The job still fails if formatting or strict Clippy fails.
        if: ${{ !cancelled() }}
        # Slint's GUI library and test target together exceeded 16 GiB locally.
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --workspace --locked --keep-going --no-fail-fast
      - name: parity ratchet
        run: cargo xtask ratchet --check
      - name: save native GUI renders
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-gui-renders-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/tmp/*.png
          if-no-files-found: ignore
          retention-days: 3

  # Keep exact-reference backend/model replays moving when GUI compilation
  # needs a repair. This lane is only for the owner's continuing parity work.
  parity-models:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'codex/parity-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: reference and backend tests
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p hydrus-core -p hydrus-download -p hydrus-downloader-exchange -p hydrus-gui-model -p hydrus-net -p hydrus-search -p hydrus-store --locked --keep-going --no-fail-fast

  # hydrus-rs should build and pass its tests on Windows and macOS too; the
  # Linux job above is the full check (lints and the parity ratchet).
  other-platforms:
    if: github.event_name != 'push' || (github.ref != 'refs/heads/codex/overnight-gui-burndown' && !startsWith(github.ref, 'refs/heads/codex/parity-'))
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          # their cold builds are long: keep what a failed run built
          cache-on-failure: true
      - name: install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: build
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo build --workspace --all-targets --locked --keep-going
      - name: test
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --workspace --locked --keep-going --no-fail-fast
