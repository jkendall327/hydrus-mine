name: rust

on:
  push:
    branches: [master, 'claude/**', 'codex/**']
    paths: ['crates/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  # (from the Actions tab)
  workflow_dispatch:

concurrency:
  group: rust-${{ github.ref }}
  # Overnight implementation continues while earlier checkpoints validate.
  cancel-in-progress: ${{ github.head_ref != 'codex/overnight-gui-burndown' && github.ref != 'refs/heads/codex/overnight-gui-burndown' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # This branch has an open PR: run once per checkpoint, rather than both
    # its push and pull_request events. Other branch pushes still validate.
    if: github.event_name != 'push' || github.ref != 'refs/heads/codex/overnight-gui-burndown'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: install media tools, and fontconfig for the GUI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: test
        # Slint's GUI library and test target together exceeded 16 GiB locally.
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --workspace --locked
      - name: parity ratchet
        run: cargo xtask ratchet --check

  # hydrus-rs should build and pass its tests on Windows and macOS too; the
  # Linux job above is the full check (lints and the parity ratchet).
  other-platforms:
    if: github.event_name != 'push' || github.ref != 'refs/heads/codex/overnight-gui-burndown'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          # their cold builds are long: keep what a failed run built
          cache-on-failure: true
      - name: install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: build
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo build --workspace --all-targets --locked
      - name: test
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --workspace --locked --no-fail-fast
