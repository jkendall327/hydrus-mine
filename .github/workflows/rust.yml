name: rust

on:
  push:
    branches: [master, 'claude/**', 'codex/**']
    paths: ['crates/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.github/workflows/rust.yml']
  # (from the Actions tab)
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run the deferred full workspace and cross-platform validation
        type: boolean
        required: false
        default: false

concurrency:
  # Each integration PR owns one current run. Separate checkpoint branches still
  # validate concurrently; repairing a PR supersedes its obsolete running head.
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quick-check:
    # Implementation mode: one current Linux lane, with no native GUI binaries,
    # native GUI suite, platform matrix, render review or parity audit.
    if: (github.event_name != 'workflow_dispatch' || !inputs.full_validation) && (github.event_name != 'push' || (github.ref != 'refs/heads/codex/overnight-gui-burndown' && !startsWith(github.ref, 'refs/heads/codex/parity-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: install media tools and fontconfig
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: strict Clippy and type checking
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings 2>&1 | tee /tmp/hydrus-quick-clippy.log
      - name: save cheap compiler diagnostics
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: quick-clippy-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hydrus-quick-clippy.log
          if-no-files-found: ignore
          retention-days: 3
      - name: fast core and GUI-model tests
        run: |
          cargo test -p hydrus-core --lib --locked
          cargo test -p hydrus-gui-model --test model --locked

  check:
    # Deferred until the owner explicitly requests the final validation pass.
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse compilation completed before a later diagnostic fails.
          cache-on-failure: true
          # GUI fixture-only repairs can reuse the unchanged workspace libraries.
          # Keep this experiment on Linux while measuring cache/storage cost.
          cache-workspace-crates: true
      - name: install media tools, and fontconfig for the GUI
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: compiler diagnostics
        # Catch GUI/test type errors without waiting for full code generation.
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          set -o pipefail
          cargo check --workspace --all-targets --locked --keep-going 2>&1 | tee /tmp/hydrus-types.log
      - name: save immediate compiler diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: compiler-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hydrus-types.log
          if-no-files-found: ignore
          retention-days: 3
      - name: clippy
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked --keep-going 2>&1 | tee /tmp/hydrus-clippy.log
      - name: save immediate Clippy diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hydrus-clippy.log
          if-no-files-found: ignore
          retention-days: 3
      - name: test
        # Keep behavioral feedback flowing even when a lint needs repair.
        # The job still fails if formatting or strict Clippy fails.
        if: ${{ !cancelled() }}
        # Slint's GUI library and test target together exceeded 16 GiB locally.
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee /tmp/hydrus-tests.log
      - name: save immediate test diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hydrus-tests.log
          if-no-files-found: ignore
          retention-days: 3
      - name: parity ratchet
        run: cargo xtask ratchet --check
      - name: save native GUI renders
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: native-gui-renders-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/tmp/*.png
          if-no-files-found: ignore
          retention-days: 3

  # Keep exact-reference backend/model replays moving when GUI compilation
  # needs a repair. This lane is only for the owner's continuing parity work.
  parity-models:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-workspace-crates: true
      - name: install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: reference and backend tests
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo test -p hydrus-core -p hydrus-download -p hydrus-downloader-exchange -p hydrus-gui-model -p hydrus-net -p hydrus-search -p hydrus-store --locked --no-fail-fast

  # hydrus-rs should build and pass its tests on Windows and macOS too; the
  # Linux job above is the full check (lints and the parity ratchet).
  other-platforms:
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          # their cold builds are long: keep what a failed run built
          cache-on-failure: true
      - name: install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: build
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo build --workspace --all-targets --locked --keep-going
      - name: Windows headless owner lifetime replay
        if: runner.os == 'Windows'
        timeout-minutes: 5
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          cargo test -p hydrus-gui --test gui --locked headless_lifetime:: -- --nocapture
      - name: test
        env:
          CARGO_BUILD_JOBS: 1
        run: cargo test --workspace --locked --no-fail-fast
