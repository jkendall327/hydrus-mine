name: rust

# Every push and pull request that changes code runs the whole Linux check, GUI
# included. Lint and tests are separate jobs so they run side by side. Windows
# and macOS are deferred (owner, 2026-10-06) and run only when dispatched by
# hand. Changes to the tracker and the scripts alone run tracker.yml instead.
on:
  push:
    branches: [master, 'claude/**', 'codex/**']
    paths: ['crates/**', 'generated/**', 'tools/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.config/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['crates/**', 'generated/**', 'tools/**', 'xtask/**', 'oracle/**', 'parity/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.config/**', '.github/workflows/rust.yml']
  workflow_dispatch:
    inputs:
      secondary_platforms:
        description: Also build and test on Windows and macOS
        type: boolean
        required: false
        default: false

concurrency:
  # One current run per ref; a new push cancels the superseded one.
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  slint:
    # The .slint files alone, in seconds: fails fast on UI syntax/type errors.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/slint-check -> ../../target/tools
      - name: slint check
        run: cargo run -q --manifest-path tools/slint-check/Cargo.toml --target-dir target/tools

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: install fontconfig
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y libfontconfig1-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: leaf tags name known leaves
        run: python3 scripts/track.py check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari@0.9.39
      - name: workspace-hack is current
        run: |
          cargo hakari generate --diff
          cargo hakari manage-deps --dry-run
      - name: clippy
        # (the generated UI crate is not a workspace member, so is not linted)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: parity ratchet
        run: cargo xtask ratchet --check

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: install media tools and fonts
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          # libmpv2 is loaded when first needed (see crates/hydrus-gui/src/mpv.rs),
          # so the video and audio viewer tests run here rather than skip; they
          # give mpv a null audio output, so no sound card is needed
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg fontconfig libfontconfig1-dev fonts-noto-cjk libmpv2
      - name: build the generated UI on its own
        # ~13 GB peak; built alone so it never overlaps the GUI crate (see scripts/dev.sh).
        run: cargo build -p hydrus-gui-ui --locked
      - name: test
        env:
          HYDRUS_INTERCHANGE_SCREENSHOTS: ${{ github.workspace }}/target/tmp
        run: |
          mkdir -p target/tmp
          cargo test --workspace --locked --no-fail-fast
      - name: save GUI renders
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gui-renders-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/tmp/*.png
          if-no-files-found: ignore
          retention-days: 30

  other-platforms:
    if: github.event_name == 'workflow_dispatch' && inputs.secondary_platforms
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - name: install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: build the generated UI on its own
        run: cargo build -p hydrus-gui-ui --locked
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
